CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y

# PCA9546A I2C mux on the upstream bus. Both MAX30102 are strapped to 0x57
# and cannot be readdressed, so each lives behind its own mux channel.
# The driver serialises (channel select + transfer) under its own mutex —
# see i2c_tca954x.c:tca954x_transfer(). Do not add a second lock on top.
CONFIG_I2C_TCA954X=y
# Both of these default to I2C_INIT_PRIORITY (50) in Zephyr 3.6, while
# i2c_tca954x.c carries a BUILD_ASSERT demanding CHANNEL > ROOT strictly. The
# upstream defaults therefore cannot compile as shipped, and every user has to
# separate them by hand. Root first, then the channels that depend on it.
CONFIG_I2C_TCA954X_ROOT_INIT_PRIO=50
CONFIG_I2C_TCA954X_CHANNEL_INIT_PRIO=51

# ── microSD (SPI) ────────────────────────────────────────────────────────
# SPI_SDHC is `default y` once the zephyr,sdhc-spi-slot node is enabled, and
# DISK_DRIVER_SDMMC is `default y` once zephyr,sdmmc-disk is; both are listed
# explicitly so a devicetree mistake fails the build instead of silently
# dropping storage.
CONFIG_SPI=y
CONFIG_SDHC=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y

# ── SD bring-up diagnostics — REMOVE once the card mounts reliably ───────
# disk_access_init() only reports a single errno. -EFAULT in particular comes
# from sdhc_spi.c:249 and means the card DID answer, with an R1 byte carrying
# PARAMETER_ERR or ADDRESS_ERR — so the link works and a specific command is
# being rejected. Which command, and the actual R1 value, only exist inside the
# driver's log calls.
# LOG_MODE_MINIMAL prints synchronously with no log thread or buffers, so
# nothing is lost when init fails early or the console is still enumerating.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_SDHC_LOG_LEVEL_DBG=y
CONFIG_SD_LOG_LEVEL_DBG=y

# ── Downlink command channel ─────────────────────────────────────────────
# The host sends "CMD ..." lines over the BLE RX characteristic (handled in
# ble.c) and over the USB console. The console needs an input path, which a
# printk-only build does not have: CONSOLE_GETLINE gives one, on the same CDC
# ACM device the diagnostics already print to.
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y

# base64 for file download, CRC32 to verify what arrived.
CONFIG_BASE64=y

# ── Satellite roster persistence ─────────────────────────────────────────
# NVS on the board's storage_partition — 32 kB at 0xEC000, which
# xiao_ble_common.dtsi reserves for exactly this and which is clear of both the
# code partition and the UF2 bootloader.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

# ── PhysDAQ Hub ──────────────────────────────────────────────────────────
# PPG sample rate per sensor, written to SPO2_CONFIG and recorded in the log
# header. 100 Hz is the rate the single-PPG firmware was validated at.
CONFIG_PHYSDAQ_PPG_ODR_HZ=100

# Bound on data lost to an ungraceful power cut: at 1000 ms and 2 sensors at
# 100 Hz that is at most ~200 samples (3.2 kB).
CONFIG_PHYSDAQ_SD_SYNC_INTERVAL_MS=1000

# Deep sleep stays OFF on the hub. A hub records unattended and is routinely
# stationary and unworn on a bench — precisely the state the idle timer reads
# as "put down" — so System Off would cut a recording short. Idle accounting
# still runs and still appears on the status line.
CONFIG_PHYSDAQ_DEEP_SLEEP=n
CONFIG_PHYSDAQ_IDLE_TIMEOUT_SEC=10

# VBAT sense (P0.31/AIN7, gated by P0.14) — battery percentage status
CONFIG_ADC=y

# Hardware watchdog — auto-reset the SoC if the main loop hangs (e.g. a wedged
# I2C bus). Fed from the supervisor loop in src/main.c.
CONFIG_WATCHDOG=y
# crashlog.c overrides the fatal-error handler to record the fault in noinit
# RAM and reboot, instead of Zephyr's default halt-with-interrupts-locked that
# leaves the crash invisible and the watchdog to clean up 8 s later.
CONFIG_REBOOT=y
CONFIG_THREAD_NAME=y

# ── Threads and buffers ──────────────────────────────────────────────────
# One acquisition thread per PPG plus a storage thread. FATFS and the SD stack
# are stack-hungry, so the storage thread gets the largest allocation; its size
# is set in src/storage.c.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ── BLE ──────────────────────────────────────────────────────────────────
# NUS-compatible GATT service for wireless data streaming
# NUS service is implemented directly in src/ble.c using raw GATT macros
# (no CONFIG_BT_NUS dependency — that is NCS-only, not plain Zephyr).
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="PhysDAQ-Hub"
CONFIG_BT_MAX_CONN=1
# Every unit used to advertise the identical name, so a scan could not tell
# two nodes apart. ble.c appends a per-chip suffix at boot, which needs the
# name to be writable at runtime (DYNAMIC) and HWINFO for the factory device
# ID. The name is derived, not stored — no NVS is configured on this board.
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=24
CONFIG_HWINFO=y
# Allow MTU negotiation up to 247 bytes so a full data line fits in one notify.
# BT_GATT_CLIENT enables bt_gatt_exchange_mtu() — needed even on a peripheral.
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
# The host buffers above are 251 B, but the *controller* defaults to 27 B LL
# packets, so every ~120 B line went out as five link-layer packets and
# saturated the link at Windows' 30 ms interval (lines dropped by ble_send).
# Data Length Extension lets one line ride in one packet.
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# Deeper TX pools (default 3 each).
CONFIG_BT_BUF_ACL_TX_COUNT=6
CONFIG_BT_L2CAP_TX_BUF_COUNT=6
CONFIG_BT_CONN_TX_MAX=6
CONFIG_BT_ATT_TX_COUNT=6

# Radio TX power: +8 dBm (default is 0). A worn node's antenna is shadowed by
# the body, and 2.4 GHz body attenuation is severe — link fades were throttling
# throughput (visible as a slowdown in the app) and then tripping the
# supervision timeout. The extra margin rides through most fades.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Preferred connection parameters, requested from the central ~5 s after
# connect (BT_GAP_AUTO_UPDATE_CONN_PARAMS). Windows' defaults pair a lazy
# interval with a ~2 s supervision timeout; we ask for a short interval
# (15–30 ms, headroom for ~25 Hz of ~120 B lines) and a 5 s timeout so a brief
# fade degrades throughput instead of killing the link. Best-effort — the
# central may reject.
#
# DISABLED, as on the node: the update was followed within a second by a
# crash on Windows every time. Left off until the failure is understood.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=500
