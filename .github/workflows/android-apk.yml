# Builds the Android app's installable APK.
#
#  - On every push of a version tag (v1.2.0, ...): runs the unit tests, builds a
#    signed release APK and attaches it to that tag's GitHub release as
#    PhysDAQ-Android-<tag>.apk (release.yml creates the release; this waits for it).
#  - From the Actions tab ("Run workflow"): same build, APK kept as a run artifact.
#
# Signing (one-time setup, see docs/development.md#android-release-apk): repo
# Settings -> Secrets and variables -> Actions -> add
#   PHYSDAQ_KEYSTORE_BASE64, PHYSDAQ_KEYSTORE_PASSWORD, PHYSDAQ_KEY_ALIAS, PHYSDAQ_KEY_PASSWORD
# Without them it builds a debug-signed APK instead, which still installs but
# cannot update an APK signed with the release key.
name: android-apk

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.PHYSDAQ_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew test

      - name: Restore signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.PHYSDAQ_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/physdaq-release.jks"
          echo "PHYSDAQ_KEYSTORE=$RUNNER_TEMP/physdaq-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          PHYSDAQ_KEYSTORE_PASSWORD: ${{ secrets.PHYSDAQ_KEYSTORE_PASSWORD }}
          PHYSDAQ_KEY_ALIAS: ${{ secrets.PHYSDAQ_KEY_ALIAS }}
          PHYSDAQ_KEY_PASSWORD: ${{ secrets.PHYSDAQ_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build debug APK (no signing key configured)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::No release signing key in secrets; building a debug-signed APK."
          ./gradlew assembleDebug

      - name: Name the APK
        id: name
        run: |
          src=$(find app/build/outputs/apk -name '*.apk' | grep -v unsigned | head -n 1)
          if [ -z "$src" ]; then echo "::error::No APK was produced"; exit 1; fi
          label="${GITHUB_REF_NAME//\//-}"
          out="PhysDAQ-Android-${label}.apk"
          cp "$src" "$out"
          echo "file=android/$out" >> "$GITHUB_OUTPUT"
          echo "Built $out from $src"

      - uses: actions/upload-artifact@v4
        with:
          name: PhysDAQ-Android-apk
          path: ${{ steps.name.outputs.file }}

      # release.yml creates the (draft) release for this tag after its own, slower
      # jobs. Wait for it, then attach the APK. If it never appears, download the
      # artifact above from this run and drag it into the release by hand.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                  -q ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -n 1)
            if [ -n "$id" ]; then
              gh release upload "$GITHUB_REF_NAME" "${{ steps.name.outputs.file }}" --clobber \
                || gh api -X POST -H "Content-Type: application/vnd.android.package-archive" \
                     "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$(basename "${{ steps.name.outputs.file }}")" \
                     --input "${{ steps.name.outputs.file }}"
              exit 0
            fi
            echo "Release for $GITHUB_REF_NAME not there yet ($i/60); waiting 60 s"
            sleep 60
          done
          echo "::error::No release for $GITHUB_REF_NAME after 60 min. Attach the artifact by hand."
          exit 1
