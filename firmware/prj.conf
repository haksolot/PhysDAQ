CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y

# VBAT sense (P0.31/AIN7, gated by P0.14) — battery percentage status
CONFIG_ADC=y

# Seconds of gyro inactivity before entering deep sleep (System Off via nRF HAL).
# Change here without touching source code.
CONFIG_MAID_IDLE_TIMEOUT_SEC=30

# BLE — NUS-compatible GATT service for wireless data streaming
# NUS service is implemented directly in firmware/src/ble.c using raw GATT
# macros (no CONFIG_BT_NUS dependency — that is NCS-only, not plain Zephyr).
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="MAID"
CONFIG_BT_MAX_CONN=1
# Allow MTU negotiation up to 247 bytes so a full data line fits in one notify.
# BT_GATT_CLIENT enables bt_gatt_exchange_mtu() — needed even on a peripheral.
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
