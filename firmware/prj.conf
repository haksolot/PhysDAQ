CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y

# Seconds of gyro inactivity before entering deep sleep (System Off via nRF HAL).
# Change here without touching source code.
CONFIG_MAID_IDLE_TIMEOUT_SEC=30

# BLE — Nordic UART Service (NUS) for wireless data streaming
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="MAID"
CONFIG_BT_NUS=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
