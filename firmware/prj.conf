CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
# DTR on the CDC ACM console tells power.c whether a host holds the USB port
# open — a cabled session must hold off deep sleep like a BLE link does.
CONFIG_UART_LINE_CTRL=y

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y

# VBAT sense (P0.31/AIN7, gated by P0.14) — battery percentage status
CONFIG_ADC=y

# Hardware watchdog — auto-reset the SoC if main() hangs (e.g. a wedged I2C
# bus). Fed each loop iteration in firmware/src/main.c.
CONFIG_WATCHDOG=y
# crashlog.c overrides the fatal-error handler to record the fault in noinit
# RAM and reboot, instead of Zephyr's default halt-with-interrupts-locked that
# left the crash invisible and the watchdog to clean up 8 s later.
CONFIG_REBOOT=y
# Headroom. main() formats a 160 B line through picolibc's printf on top of
# the sensor structs, and the default 1 KiB was never measured against it.
CONFIG_MAIN_STACK_SIZE=2048
# Thread names for the watchdog starvation report ("CPU held by ...").
CONFIG_THREAD_NAME=y

# Seconds of inactivity (no motion AND no validated skin contact) before
# entering deep sleep (System Off via nRF HAL). Change here without
# touching source code.
CONFIG_PHYSDAQ_IDLE_TIMEOUT_SEC=10

# BLE — NUS-compatible GATT service for wireless data streaming
# NUS service is implemented directly in firmware/src/ble.c using raw GATT
# macros (no CONFIG_BT_NUS dependency — that is NCS-only, not plain Zephyr).
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="PhysDAQ"
CONFIG_BT_MAX_CONN=1
# Every unit used to advertise the identical "PhysDAQ", so a scan could not tell
# two nodes apart. ble.c appends a per-chip suffix at boot, which needs the name
# to be writable at runtime (DYNAMIC) and HWINFO for the factory device ID.
# The name is derived, not stored — no NVS is configured on this board.
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=24
CONFIG_HWINFO=y
# Allow MTU negotiation up to 247 bytes so a full data line fits in one notify.
# BT_GATT_CLIENT enables bt_gatt_exchange_mtu() — needed even on a peripheral.
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
# The host buffers above are 251 B, but the *controller* was still at the
# 27 B LL default (CONFIG_BT_CTLR_DATA_LENGTH_MAX=27 in build/zephyr/.config),
# so every ~120 B line went out as five link-layer packets. That is what
# saturated the link at Windows' 30 ms interval and made ble_send() drop
# lines ("dropped N" in the Power: status). Data Length Extension lets one
# line ride in one packet; Windows negotiates it.
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# Deeper TX pools (default 3 each): a burst of a sample, battery and status
# line within one interval no longer stalls the TX thread.
CONFIG_BT_BUF_ACL_TX_COUNT=6
CONFIG_BT_L2CAP_TX_BUF_COUNT=6
CONFIG_BT_CONN_TX_MAX=6
CONFIG_BT_ATT_TX_COUNT=6

# Radio TX power: +8 dBm (default is 0). A worn node's antenna is shadowed by
# the body, and 2.4 GHz body attenuation is severe — link fades were throttling
# throughput (visible as a slowdown in the app) and then tripping the
# supervision timeout. The extra margin rides through most fades.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Preferred connection parameters, requested from the central ~5 s after
# connect (BT_GAP_AUTO_UPDATE_CONN_PARAMS). Windows' defaults pair a lazy
# interval with a ~2 s supervision timeout; we ask for a short interval
# (15–30 ms, headroom for ~25 Hz of ~120 B lines) and a 5 s timeout so a brief
# fade degrades throughput instead of killing the link. Best-effort — the
# central may reject.
#
# DISABLED: on Windows the node died ~50 ms to ~1 s after the update was
# applied ("BLE: conn params: interval 15 ms" was the last line before the
# console vanished), every time, and reset with cause=watchdog. Left off until
# the failure is understood; the central's defaults are what worked before.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=500
