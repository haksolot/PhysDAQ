appId: ca.bcit.physdaq
productName: PhysDAQ
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# The Python sidecar (PyInstaller bundle of scripts/bridge.py). Built by
# `npm run build:sidecar` into app/sidecar/bridge/, shipped verbatim next to
# app.asar so main/sidecar.ts finds it at <resourcesPath>/bridge/bridge[.exe].
# Never put this inside asar — the OS cannot exec a file from an archive.
extraResources:
  - from: sidecar/bridge
    to: bridge
    filter:
      - '**/*'
  # Firmware images for in-app flashing, produced by the CI firmware job. Kept
  # out of asar for symmetry with the sidecar and so main/flasher.ts can resolve
  # them at <resourcesPath>/firmware/physdaq.uf2 and physdaq-hub.uf2. Both
  # applications run on the same board, so the operator picks which to flash.
  # A local build has no images here (*.uf2 is gitignored) and the flash button
  # reports itself unavailable.
  - from: resources/firmware
    to: firmware
    filter:
      - '**/*'
win:
  target: nsis
  executableName: PhysDAQ
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target: dmg
  entitlementsInherit: build/entitlements.mac.plist
  # Only what the app actually touches. Bluetooth is mandatory, not optional:
  # macOS terminates a packaged app that reaches CoreBluetooth without this key,
  # and BLE is one of the two ways a node connects. Documents is where sessions
  # are written (Documents/PhysDAQ_Sessions).
  extendInfo:
    - NSBluetoothAlwaysUsageDescription: PhysDAQ connects to sensor nodes over Bluetooth Low Energy.
    - NSDocumentsFolderUsageDescription: PhysDAQ saves recorded sessions to your Documents folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  # snap is deliberately absent: it needs snapcraft + lxd on the build machine
  # and is by far the most fragile of the three targets in CI.
  target:
    - AppImage
    - deb
  maintainer: BCIT
  category: Science
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
